		<style>
			#grid{
				display: grid;
				border: thin solid black;
				grid-template-columns: repeat(5, 1fr);
				width: fit-content;
			}
			#buttons, #words{
				border: thin solid black;
				width: fit-content;
			}
			#wordlist{
				width: 150px;

			}
			.square{
				border: thin solid black;
				background: white;
				margin: 0px;
				min-width: 50px;
				max-width: 100px;
				aspect-ratio: 1 / 1;
				position: relative;
				display: flex;
				justify-content: center;
				align-items: center;
				
				&[contenteditable="false"]{
					cursor: pointer;
				}
			}
			.checked:after{
				--b: 75%; /* thickness */
				--s: 45%; /* space around */            
				--c: #B90504;
				
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				//display: block;
				height: 100%;
				aspect-ratio: 1;
				border-radius: 50%;
				box-sizing: border-box;
				--g:conic-gradient(var(--c) 0 0) no-repeat 50%/;
				//background: 
				//	var(--g) var(--b) calc(100% - 2*var(--s)),
				//	var(--g) calc(100% - 2*var(--s)) var(--b);
				//rotate: 45deg;
				background-size: 100%;
				filter: opacity(50%);
			}
			.edited{
				background-color: rgba(255, 0, 0, 10%);
			}
			.soldiers .checked:after{
				background-image: url("Emblem_Soldiers.png");
			}
			.soldiers .edited{
				background-color: rgba(0, 0, 255, 10%);
			}
			.seekers .checked:after{
				background-image: url("Emblem_Seekers.png");
			}
			.seekers .edited{

			.schemers .checked:after{
				background-image: url("Emblem_Schemers.png");
			}
			.schemers .edited{

		</style>

	<script>
		var isDirty = function() {
			return false; //add checker for changes made
		}
		window.addEventListener('beforeunload', function(e) {
			if( !isDirty() ){
				return undefined;
			}
			
			var confirmationMessage = 'You\'ve made some changes. If you leave without saving, your changes will be lost.';
			
			(e || window.event).returnValue = confirmationMessage;
			return confirmationMessage;
		});
		
		document.querySelector('#icontype input[value="' + localStorage.getItem('icontype') + '"]').checked = true;
		document.getElementById('grid').className = localStorage.getItem('icontype');
		document.getElementById('editableCheck').checked = localStorage.getItem('editable') == 'true';
		toggleEditable(localStorage.getItem('editable') == 'true');
		
		function randomize(){
			let grid = document.getElementById('grid').children;
			let words = document.getElementById('wordlist').value.trim().split('\n');
			//shuffle words
			let currentIndex = words.length;
			while( currentIndex != 0 ){
				let randomIndex = Math.floor(Math.random() * currentIndex);
				currentIndex--;
				[words[currentIndex], words[randomIndex]] = [
					words[randomIndex], words[currentIndex]];
			}
			//fill grid, ignoring pre-filled boxes
			for(let i=0, j=0; i < words.length && j < grid.length; i++, j++){
				while( j < grid.length && grid[j].classList.contains('edited') ){
					j++;
				}
				if( j >= grid.length )
					break;
				grid[j].innerHTML = words[i];
			}
		}
		function clearAll(){
			let grid = document.getElementById('grid').children;
			for(let child of grid){
				child.innerHTML = '';
				child.classList.remove('edited');
				child.classList.remove('checked');
			}
		}
		function clearSome(){
			let grid = document.getElementById('grid').children;
			for(let child of grid){
				child.classList.remove('checked');
				if( !child.classList.contains('edited') )
					child.innerHTML = '';
			}
		}
		function toggleEditable(value){
			let grid = document.getElementById('grid').children;
			for(let child of grid){
				if(value){
					child.contentEditable = 'true';
				}
				else{
					child.contentEditable = 'false';
				}
			}
		}
		function saveGrid(){
			if( typeof(Storage) === 'undefined' ){
				alert('No local storage option available.');
				return;
			}
			
			let grid = document.getElementById('grid').children;
			let filledGrid = [];
			let exesGrid = [];
			for(let child of grid){
				filledGrid.push(child.innerText);
				exesGrid.push( child.classList.contains('checked') );
			}
			console.log(filledGrid, exesGrid);
			localStorage.setItem('savedGrid',JSON.stringify(filledGrid));
			localStorage.setItem('savedChecks',JSON.stringify(exesGrid));
		}
		function loadGrid(){
			if( typeof(Storage) === 'undefined' ){
				alert('No local storage option available.');
				return;
			}
			
			let grid = document.getElementById('grid').children;
			if( localStorage.getItem('savedGrid') !== null ){
				let filledGrid = JSON.parse(localStorage.getItem('savedGrid'));
				
				for(let i=0, j=0; i < grid.length && j < filledGrid.length; i++, j++){
					grid[i].innerHTML = filledGrid[j];
				}
			}
			if( localStorage.getItem('savedChecks') !== null ){
				let exesGrid = JSON.parse(localStorage.getItem('savedChecks'));
				
				for(let i=0, j=0; i < grid.length && j < exesGrid.length; i++, j++){
					exesGrid[j] ? grid[i].classList.add('checked') : grid[i].classList.remove('checked');
				}
			}
		}
	</script>
